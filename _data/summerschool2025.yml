# ChAMELEON Summer School 2025
#
# Content for the home page (index.html) and the participants page
# (pages/2025-SUMMERSCHOOL.html). The numbers of participants, posters,
# institutions, and invited talks shown on the site are computed from the
# lists below.

dates: "August 11–15, 2025"
time: "9:00 AM – 5:00 PM"
location: "CBB 124, University of Houston"
days: 5
lectures: 8

topics:
  - title: "Introduction to Inverse Problems"
    text: "Forward and inverse problems and the notion of well-posedness, motivated by linear regression, denoising, deblurring, computed tomography, inverse heat conduction, inverse scattering, tumor modeling, and image registration."
  - title: "Spectral Operator Theory in Inverse Problems"
    text: "The singular value decomposition of matrices and compact operators, the Picard condition, and how spectral decay causes ill-posedness; spectral regularization such as truncated SVD, Tikhonov regularization, and Landweber iteration, and how to choose the regularization parameter."
  - title: "Convex Optimization"
    text: "Convex sets and functions, projections, Fenchel conjugates, Lagrangian duality, and the KKT optimality conditions."
  - title: "Convex Non-Smooth Optimization"
    text: "Subgradient methods, proximal operators and the Moreau envelope, proximal gradient methods, and ADMM, with sparsity-promoting problems such as the LASSO as a running example."
  - title: "Optimization in Machine Learning"
    text: "Iterative shrinkage-thresholding (ISTA and FISTA) and its learned, unrolled counterpart LISTA, along with adaptive gradient methods such as AdaGrad, RMSProp, and Adam."
  - title: "Inverse Problems Governed by Dynamical Systems"
    text: "Inverse problems constrained by partial differential equations, from the inverse heat equation to large-scale applications: discretization, adjoint-based sensitivities, reduced-space Newton–Krylov methods, preconditioning, and scalability on CPUs and GPUs."
  - title: "Numerical Methods for Machine Learning"
    text: "Numerical building blocks behind learning algorithms, including finite-difference discretizations, derivative checks, and line-search methods."
  - title: "Bayesian Inverse Problems"
    text: "Likelihood and prior modeling, the posterior in finite dimensions and in function space, connections to Tikhonov regularization, MAP estimation and the Laplace approximation, sampling with Metropolis–Hastings and preconditioned Crank–Nicolson, variational inference, hierarchical models, and optimal experimental design."

hands_on: "Afternoons were devoted to hands-on assignments that combined analysis with computing in Python on the high-performance computing cluster of the Research Computing Data Core at the University of Houston. Problems ranged from well-posedness, least squares, convexity, derivative checks, and proximal operators to eigenfunction expansions for the heat equation and learned ISTA (LISTA) for denoising handwritten digits."

